[package]
name = "flare-plugin-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "Apache-2.0"
description = "Business-neutral Flare plugin manifests, registry, grants and lifecycle contracts"
repository = "https://github.com/flare-im/flare-proto"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
schemars = "1.2.1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

